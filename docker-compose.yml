version: '3.9'

services:
  web:
    image: nginx:latest
    ports:
      - "8080:80"
    networks:
      - webnet

  app:
    build: ./app
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - webnet

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - webnet

  mysql-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - webnet

volumes:
  db-data:
  mysql-data:

networks:
  webnet: